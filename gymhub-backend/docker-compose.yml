services:
  gymhub-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymhhub-db
    restart: always
    volumes:
      - gymhub_data:/var/opt/mssql
    ports:
      - "1433:1433"
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer

volumes:
  gymhub_data: